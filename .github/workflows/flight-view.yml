name: Flight view checks
on:
  pull_request:
    paths:
      - 'lib/features/launch_monitor/presentation/widgets/tabs/*flight*'
      - 'lib/features/launch_monitor/presentation/screens/profile_screen.dart'
      - 'lib/shared/providers/unit_prefs_provider.dart'
      - 'test/**'
      - '.github/workflows/flight-view.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flight-view:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze changed implementation and tests
        run: >-
          flutter analyze --no-pub
          lib/features/launch_monitor/presentation/widgets/tabs/flight_3d_tab.dart
          lib/features/launch_monitor/presentation/widgets/tabs/realistic_flight_painters.dart
          lib/features/launch_monitor/presentation/screens/profile_screen.dart
          lib/shared/providers/unit_prefs_provider.dart
          test/shared/flight_view_style_pref_test.dart
          test/features/launch_monitor/presentation/realistic_flight_test.dart
      - name: Flight preference, rendering and regression tests
        run: >-
          flutter test --no-pub --dart-define=FLIGHT_PREVIEW=true
          test/shared/flight_view_style_pref_test.dart
          test/features/launch_monitor/presentation/realistic_flight_test.dart
          test/features/launch_monitor/presentation/flight_3d_controls_test.dart
          test/features/launch_monitor/presentation/flight_trails_test.dart
          test/features/launch_monitor/presentation/replay_timing_test.dart
          test/features/launch_monitor/presentation/mow_bands_test.dart
      - name: Attach scene preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realistic-flight-preview
          path: build/flight-preview.png
          if-no-files-found: ignore
      - name: Preview image for remote visual review
        if: always()
        run: |
          if [ -f build/flight-preview.png ]; then
            printf 'FLIGHT_PREVIEW_PNG:'
            base64 -w 0 build/flight-preview.png
            printf '\n'
          fi
